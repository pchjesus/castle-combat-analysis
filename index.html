 {id:'overview', label:'인물 도감', short:'도감'},
 {id:'stats', label:'전투력 분석', short:'전투력'},
 {id:'evidence', label:'근거 · 작중 평가', short:'근거'},
 {id:'review', label:'검수 대장', short:'검수'}
];

const state = {selectedId:'char-033',view:'overview',orgId:'all',search:'',filter:'all',sidebarOpen:false,sidebarCollapsed:false};

function getCharacter(){return rosterById.get(state.selectedId) || roster.characters[0];}

function readHash(){
 const p=new URLSearchParams(location.hash.replace(/^#/,''));
 const id=p.get('character'); const v=p.get('view');
 if(rosterById.has(id))state.selectedId=id;
 if(VIEWS.some(x=>x.id===v))state.view=v;
}
function writeHash(){
 const next='#'+new URLSearchParams({character:state.selectedId,view:state.view}).toString();
 if(location.hash!==next) history.replaceState(null,'',next);
}
function setCharacter(id){if(!rosterById.has(id))return;state.selectedId=id;state.sidebarOpen=false;writeHash();render();window.scrollTo({top:0,behavior:'instant'});}

function filteredCharacters(){let q=state.search.trim().toLocaleLowerCase('ko');return roster.characters.filter(c=>{

 <div style="display:grid;gap:18px;align-content:start"><section class="panel"><div class="panel-header"><div><h2>전투 프로필</h2><p class="panel-sub">공통 역량과 무기·전법의 관계를 분리</p></div><span class="section-tag">COMBAT PROFILE</span></div><div class="profile-grid"><div class="profile-cell"><strong>주요 전투 방식</strong><span>검수 전</span></div><div class="profile-cell"><strong>무장·거리</strong><span>검수 전</span></div><div class="profile-cell"><strong>전술·상황 적응</strong><span>검수 전</span></div><div class="profile-cell"><strong>제약과 한계</strong><span>검수 전</span></div></div><hr class="section-rule"><p class="status-note">한 전투의 결과를 여러 능력치에 자동 중복 가산하지 않아.</p></section>

function evidenceLegacy(){const f=FILTERS.find(x=>x.id===state.filter);return `${hero()}<div class="section-grid"><section class="panel"><div class="panel-header"><div><h2>원작 근거</h2><p class="panel-sub">전투·발언·사건 근거를 구분해 탐색</p></div><span class="section-tag">EVIDENCE</span></div><div class="evidence-toolbar" role="group" aria-label="근거 유형 필터">${FILTERS.map(x=>`<button type="button" class="filter-btn ${state.filter===x.id?'active':''}" data-filter="${x.id}" aria-pressed="${state.filter===x.id}">${x.label} <small>0</small></button>`).join('')}</div>${empty(`${h(f.label)} 근거: 현재 시안에 연결된 기록 0건`,'과거 v2.1 실험 근거가 없다는 뜻은 아니야. 원본 계약과 데이터를 가져온 뒤 실제 기록을 보여줄 예정이야.')}

 if(preview){
  return '<figure class="quote-note quote-note-preview" aria-label="독자 제공 명대사 - 원작 미검수">'
   +'<span class="section-tag">CHARACTER QUOTE / USER CURATED</span>'
   +'<blockquote style="font-size:19px;line-height:1.8;margin:12px 0;white-space:pre-wrap">'+h(preview.exactText)+'</blockquote>'
   +'<figcaption style="font-size:12px;color:#667069">'+h(preview.display.sourceLabel)+' · '+h(preview.display.verificationLabel)+' · 전투 점수와 무관</figcaption></figure>';
 }
 const q=quotationData?.quotationCandidates?.find(q=>q.characterId===state.selectedId&&q.verificationStatus==='canon-direct'&&q.publicationStatus==='approved'&&q.rightsReview==='cleared'&&typeof q.exactText==='string'&&q.exactText.trim()&&typeof q.sourceReference==='string'&&q.sourceReference.trim());
 if(!q)return '';
 const ref=/^https:\/\/[a-z0-9.-]+\//i.test(q.sourceReference)?'<a href="'+h(q.sourceReference)+'" target="_blank" rel="noopener noreferrer">출처 확인 ↗</a>':h(q.sourceReference);
 return '<figure class="quote-note" aria-label="검수된 인물 명대사"><span class="section-tag">CHARACTER QUOTE / CANON CHECKED</span><blockquote style="font-size:19px;line-height:1.6;margin:12px 0">'+h(q.exactText)+'</blockquote><figcaption style="font-size:12px;color:#667069">'+h(q.workPart==null?'부 미확인':q.workPart+'부')+' · '+h(q.episode||'회차 미확인')+' · '+ref+' · 전투 점수와 무관</figcaption></figure>';
}
function overview(){return overviewBase()+quotationPanel();}
function stats(){return statsBase()+eraPanel();}
function evidence(){
 const c=getCharacter();
 if(pilotData)return hero()+CastlePilotView.evidencePanel(pilotData,c,state.filter,null,h);
 return hero()+'<section class="panel" style="margin-top:18px"><h2>'+(pilotError?'v2.1 자료 연결 실패':'v2.1 검토 후보 불러오는 중')+'</h2><p class="panel-sub">'+h(pilotError||'원본 자료의 구조를 검사 중이야.')+'</p></section>';
}
function review(){
 if(pilotData)return hero()+CastlePilotView.reviewPanel(pilotData,h,pilotReviewQueue);
 return hero()+'<section class="panel" style="margin-top:18px"><h2>'+(pilotError?'검수 자료 연결 실패':'검수 대장 불러오는 중')+'</h2><p>연결 실패는 원작의 근거 부족을 의미하지 않아.</p></section>';
}
async function loadDraftData(){
 const get=async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' / '+path);return r.json();};
 try{pilotData=CastlePilotView.check(await get('data/pilot-evidence.v2.1.json'),roster);}
 catch(e){pilotError='데이터 로드·검증 오류: '+e.message;console.error(pilotError);}
 try{
   const q=await get('data/pilot-review-queue.v2.2.json');
   const allIds=[...pilotData.evidence,...pilotData.statements].map(r=>r.id);
   if(q.schemaVersion==='v2.2-review-queue-draft' && q.records.length===19 &&
      new Set(q.records.map(r=>r.recordId)).size===19 && q.records.every(r=>allIds.includes(r.recordId)&&r.verification==='not-directly-checked'&&r.approval==='none') &&
      q.summary.directCanonVerified===0 && q.summary.approvedEvaluations===0)pilotReviewQueue=q;
 }catch(e){console.warn('Review queue unavailable',e);}
 try{const x=await get('data/temporal-evaluation-candidates.v0.1.json');if(x.schemaVersion==='0.1-draft'&&Array.isArray(x.candidates)&&x.candidates.every(p=>rosterById.has(p.characterId)&&Array.isArray(p.evaluationStates)&&!p.evaluationStates.length))temporalData=x;}catch(e){console.warn('Temporal research queue unavailable',e);}
 try{const x=await get('data/quotation-review.v0.1.json');if(x.schemaVersion==='0.1-draft'&&Array.isArray(x.quotationCandidates))quotationData=x;}catch(e){console.warn('Quotation research queue unavailable',e);}
 try{
  const x=await get('data/character-quotes.v3.4.DRAFT.json');
  if(x.schemaVersion==='v3.4-character-quotes-preview'&&Array.isArray(x.quotes)&&x.quotes.length===22&&
    new Set(x.quotes.map(q=>q.characterId)).size===9&&
    x.quotes.every(q=>rosterById.has(q.characterId)&&q.verificationStatus==='user-transcribed-secondary'&&q.publicationStatus==='branch-preview-requested'&&q.display?.enabledInPreview===true&&typeof q.exactText==='string'&&q.exactText.trim())){
    quotationPreviewData=x;
  }
 }catch(e){console.warn('Optional user-curated quote preview unavailable',e);}
 render();
}
function render(){
 root.innerHTML=`<div class="app ${state.sidebarCollapsed?'sidebar-collapsed':''}"><div class="mobile-backdrop ${state.sidebarOpen?'show':''}" data-close-sidebar="true"></div>${sidebar()}<div class="app-main">${header()}<main class="content">${topTitle()}<div id="current-panel" role="tabpanel" aria-labelledby="tab-${state.view}" class="view-panel">${state.view==='overview'?overview():state.view==='stats'?stats():state.view==='evidence'?evidence():review()}</div><footer class="footer" aria-label="팬 프로젝트 및 저작권 안내"><div class="footer-copy"><strong>비공식 · 비영리 팬 제작 프로젝트</strong><p>이 사이트는 웹툰 《캐슬》을 개인적으로 감상·연구하기 위해 만든 비공식 팬 프로젝트의 공개 읽기 전용 시안입니다. 네이버웹툰이나 원작 권리자와 제휴·협력한 공식 서비스가 아니며, 표시된 분석은 원작의 공식 전투력이나 작가의 판단을 대변하지 않습니다.</p><p>원작 및 관련 이미지·캐릭터의 저작권은 각 권리자에게 있습니다. 본 안내문은 저작물의 복제·게시 허락을 의미하지 않습니다. 원작 이미지 게시에는 권리 관계에 대한 별도 확인이 필요합니다.</p></div><div class="footer-meta"><span>PUBLIC MVP · CANON VERIFICATION PENDING</span><a href="https://github.com/pchjesus/castle-combat-analysis" rel="noopener noreferrer" target="_blank">프로젝트 GitHub ↗</a></div></footer></main></div></div>`;
 bindEvents();
}
function bindEvents(){
 document.querySelectorAll('[data-character]').forEach(el=>el.addEventListener('click',()=>setCharacter(el.dataset.character)));
 $('[data-sidebar-toggle]').addEventListener('click',()=>{
   state.sidebarCollapsed=!state.sidebarCollapsed;
   render();
   $('[data-sidebar-toggle]')?.focus();
 });
 $('[data-sidebar-search]').addEventListener('click',()=>{
   state.sidebarCollapsed=false;
   render();
   $('#character-search')?.focus();
 });
 document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>setView(el.dataset.view)));
 document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{state.filter=el.dataset.filter;render();}));
 document.querySelectorAll('[data-review-open]').forEach(el=>el.addEventListener('click',()=>{
   const {reviewOpen: recordId,reviewCharacter: characterId}=el.dataset;
   if(!rosterById.has(characterId))return;
   state.filter='all';
   setCharacter(characterId);
   setView('evidence');
   const details=document.getElementById('record-'+recordId);
   if(details){details.open=true;details.scrollIntoView({block:'start',behavior:'instant'});details.querySelector('summary')?.focus();}
 }));
 $('#org-select').addEventListener('change',e=>{state.orgId=e.target.value;state.search='';const list=filteredCharacters();if(list.length&&!list.some(c=>c.id===state.selectedId)){state.selectedId=list[0].id;writeHash();}render();});
 $('#character-search').addEventListener('input',e=>{
 state.search=e.target.value;const list=filteredCharacters();$('#result-count').textContent=list.length+'명';$('#character-list').innerHTML=characterButtons(list);
 $('#character-list').querySelectorAll('[data-character]').forEach(el=>el.addEventListener('click',()=>setCharacter(el.dataset.character)));
 });
 $('#mobile-menu').addEventListener('click',()=>{state.sidebarOpen=!state.sidebarOpen;render();$('#character-search')?.focus();});
 document.querySelectorAll('[data-close-sidebar]').forEach(el=>el.addEventListener('click',()=>{state.sidebarOpen=false;render();$('#mobile-menu')?.focus();}));
 document.querySelector('.view-tabs').addEventListener('keydown', e=>{
 if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;
 e.preventDefault(); const current=VIEWS.findIndex(v=>v.id===state.view);
 let index=e.key==='ArrowRight'?(current+1)%VIEWS.length:e.key==='ArrowLeft'?(current+VIEWS.length-1)%VIEWS.length:e.key==='Home'?0:VIEWS.length-1;
 setView(VIEWS[index].id);$('#tab-'+VIEWS[index].id)?.focus();
 });
}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sidebarOpen){state.sidebarOpen=false;render();$('#mobile-menu')?.focus();}});
window.addEventListener('hashchange',()=>{readHash();render();});
readHash();writeHash();render();loadDraftData();
window.__CASTLE_MVP_TEST__={roster,state,filteredCharacters,axes:COMMON_AXES};
})();

</script></body></html>
