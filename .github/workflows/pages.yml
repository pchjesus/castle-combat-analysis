name: Publish read-only Castle MVP
on:
  push:
    branches: [main, codex/v2.4-ui-research]
    paths:
      - 'index.html'
      - 'data/roster.v0.1.json'
      - 'scripts/check-mvp.mjs'
      - 'scripts/check-browser-v2.1.mjs'
      - 'scripts/check-pilot-v2.1.mjs'
      - 'scripts/pilot-v2.1-view.js'
      - 'data/pilot-evidence.v2.1.json'
      - 'data/pilot-review-queue.v2.2.json'
      - 'data/temporal-evaluation-candidates.v0.1.json'
      - 'data/quotation-review.v0.1.json'
      - 'data/character-quotes.v3.4.DRAFT.json'
      - 'scripts/check-public-quotes-v3.6.mjs'
      - 'scripts/check-iskra-quotes-browser-v3.6.mjs'
      - 'scripts/check-live-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and read-only boundaries
        run: |
          node scripts/check-mvp.mjs
          node scripts/check-pilot-v2.1.mjs
          node scripts/check-character-images.mjs
          node scripts/check-public-quotes-v3.6.mjs
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Korean fonts for visual verification
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Prepare browser test tooling outside the project
        run: |
          npm install --prefix "$RUNNER_TEMP/castle-browser-tools" playwright@1.56.1
          ln -s "$RUNNER_TEMP/castle-browser-tools/node_modules" node_modules
      - name: Check six responsive viewports and navigation contrast
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          SCREENSHOT_DIR: browser-screenshots
        run: |
          node scripts/check-browser-v2.1.mjs
          node scripts/check-iskra-quotes-browser-v3.6.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: castle-responsive-screenshots
          path: browser-screenshots
          if-no-files-found: ignore
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, browser-regression]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static site only
        run: |
          mkdir -p _site/data _site/scripts
          cp index.html _site/index.html
          cp scripts/pilot-v2.1-view.js _site/scripts/
          cp data/pilot-evidence.v2.1.json _site/data/
          cp data/pilot-review-queue.v2.2.json _site/data/
          cp data/temporal-evaluation-candidates.v0.1.json _site/data/
          cp data/quotation-review.v0.1.json _site/data/
          cp data/character-quotes.v3.4.DRAFT.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check public HTTPS site and v2.2 assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-live-pages.mjs
