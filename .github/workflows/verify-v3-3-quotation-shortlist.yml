name: Verify v3.3 quotation shortlist (research only)
on:
  push:
    branches:
      - research/v3.3-quotation-shortlist
    paths:
      - 'data/research/quotation-shortlist.v3.3.DRAFT.json'
      - 'docs/research/V3_3_QUOTATION_SHORTLIST_DRAFT.md'
      - 'scripts/check-quotation-shortlist-v3.3.mjs'
      - 'scripts/check-user-quotation-curation-v3.3.mjs'
      - 'data/research/user-quotation-curation.v3.3.DRAFT.json'
      - '.github/workflows/verify-v3-3-quotation-shortlist.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing research and roster regression
        run: |
          node scripts/check-mvp.mjs
          node scripts/check-pilot-v2.1.mjs
          node scripts/check-analysis-depth-coverage-v2.9.mjs
          node scripts/check-l2-axis-fairness-v3.0.mjs
          node scripts/check-axis-observation-v3.1.mjs
          node scripts/check-source-quote-gates-v3.2.mjs
      - name: Check v3.3 candidate identity and safe publication gates
        run: node scripts/check-quotation-shortlist-v3.3.mjs
      - name: Check user-nominated quotes and Aquila's first-choice status
        run: node scripts/check-user-quotation-curation-v3.3.mjs
