name: Verify standard depth and 109 roster coverage v2.9
on:
  push:
    branches:
      - research/v2.9-standard-depth-coverage
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing read-only roster and evidence contracts
        run: |
          node scripts/check-mvp.mjs
          node scripts/check-pilot-v2.1.mjs
          node scripts/check-character-images.mjs
      - name: Validate L1/L2/L3 coverage, specialist status and no implicit scores
        run: node scripts/check-analysis-depth-coverage-v2.9.mjs
