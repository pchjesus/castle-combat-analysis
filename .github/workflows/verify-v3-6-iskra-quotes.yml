name: Verify v3.6 Iskra quotes and Komodo correction (no deployment)
on:
  push:
    branches:
      - feature/v3.6-iskra-quote-selection
    paths:
      - 'index.html'
      - 'data/roster.v0.1.json'
      - 'data/character-quotes.v3.4.DRAFT.json'
      - 'data/research/iskra-quote-selection-status.v3.6.DRAFT.json'
      - 'docs/research/V3_6_ISKRA_QUOTES_AND_KOMODO_CORRECTION.md'
      - 'scripts/check-quote-gallery-v3.4.mjs'
      - 'scripts/check-iskra-quote-curation-v3.5.mjs'
      - 'scripts/check-iskra-quote-selection-v3.6.mjs'
      - 'scripts/check-iskra-quotes-browser-v3.6.mjs'
      - '.github/workflows/verify-v3-6-iskra-quotes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing 109-character roster and evidence regressions
        run: |
          node scripts/check-mvp.mjs
          node scripts/check-pilot-v2.1.mjs
          node scripts/check-analysis-depth-coverage-v2.9.mjs
          node scripts/check-l2-axis-fairness-v3.0.mjs
          node scripts/check-axis-observation-v3.1.mjs
          node scripts/check-source-quote-gates-v3.2.mjs
          node scripts/check-quotation-shortlist-v3.3.mjs
          node scripts/check-user-quotation-curation-v3.3.mjs
      - name: Quote gallery and Iskra v3.5 compatible regressions
        run: |
          node scripts/check-quote-gallery-v3.4.mjs
          node scripts/check-iskra-quote-curation-v3.5.mjs
      - name: Validate six new Iskra quotes and Komodo naming correction
        run: node scripts/check-iskra-quote-selection-v3.6.mjs
  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke test quote display on desktop and mobile
        run: node scripts/check-iskra-quotes-browser-v3.6.mjs
