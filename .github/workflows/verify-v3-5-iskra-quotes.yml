name: Verify v3.5 sixteen selected quotes and Iskra research (no deployment)
on:
  push:
    branches:
      - feature/v3.5-user-quotes-iskra-research
    paths:
      - 'index.html'
      - 'data/character-quotes.v3.4.DRAFT.json'
      - 'data/research/iskra-quotation-candidates.v3.5.DRAFT.json'
      - 'scripts/check-quote-gallery-v3.4.mjs'
      - 'scripts/check-iskra-quote-curation-v3.5.mjs'
      - 'docs/research/V3_5_QUOTE_SELECTION_AND_ISKRA_NEXT_DRAFT.md'
      - '.github/workflows/verify-v3-5-iskra-quotes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing roster, Evidence and research compatibility
        run: |
          node scripts/check-mvp.mjs
          node scripts/check-pilot-v2.1.mjs
          node scripts/check-analysis-depth-coverage-v2.9.mjs
          node scripts/check-l2-axis-fairness-v3.0.mjs
          node scripts/check-axis-observation-v3.1.mjs
          node scripts/check-source-quote-gates-v3.2.mjs
          node scripts/check-quotation-shortlist-v3.3.mjs
          node scripts/check-user-quotation-curation-v3.3.mjs
      - name: Verify sixteen-user gallery contract and safe HTML
        run: node scripts/check-quote-gallery-v3.4.mjs
      - name: Verify seven new exact quotes and Iskra review groups
        run: node scripts/check-iskra-quote-curation-v3.5.mjs
